  <script src="https://pl31540133.profitableratecpmnetwork.com/d1/c6/90/d1c69001ec540c1df4427d665a74484f.js"></script>

  <!-- CONFIG -->
  <script src="js/config.js"></script>

  <!-- NOTÍCIA -->
  <script>
(async () => {

  const C = window.NEWSFY_CONFIG;
  const $ = s => document.querySelector(s);

  const q = new URLSearchParams(location.search).get("id");

  const esc = v =>
    String(v ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[c]));

  function normalize(d) {

    const f = d?.fields || d?.field_1 || d || {};
    const r = { ...d, ...f };

    return {
      id: r.id,
      titulo: r.titulo ?? "Sem título",
      slug: r.slug ?? "",
      resumo: r.resumo ?? "",
      conteudo: r.conteudo ?? "",
      categoria: r.categoria ?? "Geral",
      autor: r.autor ?? "NEWSFY",
      imagem: r.imagem ?? "",
      imagem_capa: r.imagem_capa ?? r.imagem ?? "",

      data_publicacao:
        r.data_publicacao ??
        r.data ??
        r.created_at ??
        "",

      status: r.status ?? "",

      destaque:
        r.destaque === true ||
        r.destaque === 1 ||
        r.destaque === "true" ||
        r.destaque === "1",

      visualizacoes: Number(r.visualizacoes ?? 0),

      tags: r.tags ?? "",
      fonte: r.fonte ?? "",
      url_fonte: r.url_fonte ?? "",
      meta_description: r.meta_description ?? "",
      criado_em: r.criado_em ?? "",
      atualizado_em: r.atualizado_em ?? ""
    };
  }

  function date(v) {

    if (!v) return "Agora";

    const d = new Date(v);

    if (Number.isNaN(d.getTime())) {
      return String(v);
    }

    return new Intl.DateTimeFormat("pt-BR", {
      dateStyle: "long"
    }).format(d);
  }

  async function load() {

    try {

      if (!C) {
        throw new Error("config.js não carregou");
      }

      if (!q) {
        throw new Error("ID ausente na URL");
      }

      const url =
        C.API_BASE +
        C.ENDPOINTS.noticia +
        encodeURIComponent(q);

      console.log("NEWSFY - buscando notícia:", url);

      const r = await fetch(url, {
        headers: {
          Accept: "application/json"
        },
        cache: "no-store"
      });

      console.log("NEWSFY - status:", r.status);

      if (!r.ok) {
        throw new Error("HTTP " + r.status);
      }

      let d = await r.json();

      console.log("NEWSFY - resposta:", d);

      d =
        d?.data ??
        d?.noticia ??
        d?.result ??
        d;

      if (Array.isArray(d)) {
        d = d[0];
      }

      if (!d) {
        throw new Error("Notícia vazia");
      }

      const n = normalize(d);

      console.log("NEWSFY - notícia normalizada:", n);

      if (!n.titulo || n.titulo === "Sem título") {
        throw new Error("A resposta não possui o campo titulo");
      }

      const conteudo =
        n.conteudo ||
        n.resumo ||
        "Esta notícia ainda não possui conteúdo.";

      $("#articleRoot").innerHTML = `
        <article class="article">

          <div class="article-head">

            <span class="category-badge static">
              ${esc(n.categoria)}
            </span>

            <h1>${esc(n.titulo)}</h1>

            <p class="article-lead">
              ${esc(n.resumo)}
            </p>

            <div class="article-meta">

              <span>
                Por <b>${esc(n.autor)}</b>
              </span>

              <i></i>

              <span>
                ${esc(date(n.data_publicacao))}
              </span>

            </div>

          </div>

          ${
            n.imagem_capa || n.imagem
              ? `
                <div class="article-cover">
                  <img
                    src="${esc(n.imagem_capa || n.imagem)}"
                    alt="${esc(n.titulo)}"
                  >
                </div>
              `
              : ""
          }

          <div class="article-body">
            ${esc(conteudo).replace(/\n/g, "<br><br>")}
          </div>

          <div class="article-share">

            <span>Compartilhar</span>

            <button
              onclick="navigator.clipboard?.writeText(location.href)"
            >
              Copiar link
            </button>

            ${
              n.fonte
                ? `
                  <span class="source-label">
                    Fonte: ${esc(n.fonte)}
                  </span>
                `
                : ""
            }

            ${
              n.url_fonte
                ? `
                  <a
                    class="source-link"
                    href="${esc(n.url_fonte)}"
                    target="_blank"
                    rel="noopener"
                  >
                    Fonte original ↗
                  </a>
                `
                : ""
            }

          </div>

        </article>
      `;

      document.title = n.titulo + " — NEWSFY";

      const meta = document.querySelector(
        'meta[name="description"]'
      );

      if (meta && n.meta_description) {
        meta.setAttribute(
          "content",
          n.meta_description
        );
      }

    } catch (e) {

      console.error("NEWSFY - erro ao carregar notícia:", e);

      $("#articleRoot").innerHTML = `
        <div class="empty-state">

          <div>!</div>

          <h2>Não foi possível carregar a notícia</h2>

          <p>
            ${esc(e.message || "Erro desconhecido")}
          </p>

          <a
            class="btn btn-primary"
            href="noticias.html"
          >
            Ver notícias
          </a>

        </div>
      `;
    }
  }

  $("#year").textContent =
    new Date().getFullYear();

  $("#menuToggle").onclick = () => {

    $("#leftSidebar").classList.toggle("open");
    $("#mobileOverlay").classList.toggle("show");

  };

  $("#mobileOverlay").onclick = () => {

    $("#leftSidebar").classList.remove("open");
    $("#mobileOverlay").classList.remove("show");

  };

  $("#themeBtn").onclick = () => {

    document.body.classList.toggle("soft-theme");

  };

  document
    .querySelectorAll(".nav-category")
    .forEach(b => {

      b.onclick = () => {

        location.href =
          "noticias.html?categoria=" +
          encodeURIComponent(b.dataset.category);

      };

    });

  load();

})();
</script>
