  <!-- NOTÍCIA -->
  <script>
  (() => {

    const CFG = window.NEWSFY_CONFIG;

    const $ = (selector) => document.querySelector(selector);

    const params = new URLSearchParams(window.location.search);

    const newsId = params.get("id");


    /* =========================
       ESCAPE HTML
    ========================= */

    function esc(value) {

      return String(value ?? "").replace(
        /[&<>"']/g,
        char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[char])
      );

    }


    /* =========================
       NORMALIZAR NOTÍCIA
    ========================= */

    function normalize(data) {

      const fields =
        data?.fields ||
        data?.field_1 ||
        data ||
        {};

      const raw = {
        ...data,
        ...fields
      };

      return {

        id: raw.id ?? "",

        titulo:
          raw.titulo ??
          raw.título ??
          "Sem título",

        slug:
          raw.slug ??
          "",

        resumo:
          raw.resumo ??
          "",

        conteudo:
          raw.conteudo ??
          raw.conteúdo ??
          "",

        categoria:
          raw.categoria ??
          "Geral",

        autor:
          raw.autor ??
          "NEWSFY",

        imagem:
          raw.imagem ??
          "",

        imagem_capa:
          raw.imagem_capa ??
          raw.imagem ??
          "",

        data_publicacao:
          raw.data_publicacao ??
          raw.data ??
          raw.created_at ??
          "",

        status:
          raw.status ??
          "",

        destaque:
          raw.destaque === true ||
          raw.destaque === 1 ||
          raw.destaque === "true" ||
          raw.destaque === "1",

        visualizacoes:
          Number(raw.visualizacoes ?? 0),

        tags:
          raw.tags ??
          "",

        fonte:
          raw.fonte ??
          "",

        url_fonte:
          raw.url_fonte ??
          "",

        meta_description:
          raw.meta_description ??
          "",

        criado_em:
          raw.criado_em ??
          "",

        atualizado_em:
          raw.atualizado_em ??
          ""

      };

    }


    /* =========================
       DATA
    ========================= */

    function formatDate(value) {

      if (!value) {
        return "Agora";
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      return new Intl.DateTimeFormat(
        "pt-BR",
        {
          day: "2-digit",
          month: "long",
          year: "numeric"
        }
      ).format(date);

    }


    /* =========================
       CONTEÚDO
    ========================= */

    function formatContent(value) {

      if (!value) {
        return "";
      }

      return esc(value)
        .replace(/\r\n/g, "\n")
        .replace(/\n/g, "<br><br>");

    }


    /* =========================
       CARREGAR NOTÍCIA
    ========================= */

    async function loadArticle() {

      const root = $("#articleRoot");

      try {

        if (!newsId) {
          throw new Error("ID da notícia ausente.");
        }

        if (!CFG || !CFG.API_BASE) {
          throw new Error("Configuração da API não encontrada.");
        }

        const endpoint =
          CFG.API_BASE +
          CFG.ENDPOINTS.noticia +
          encodeURIComponent(newsId);


        console.log(
          "NEWSFY → carregando notícia:",
          endpoint
        );


        const response = await fetch(
          endpoint,
          {
            method: "GET",
            headers: {
              "Accept": "application/json"
            },
            cache: "no-store"
          }
        );


        if (!response.ok) {

          throw new Error(
            "Worker respondeu HTTP " +
            response.status
          );

        }


        let data = await response.json();


        /*
         * Aceita diferentes formatos
         * que o Worker pode retornar.
         */

        if (data?.data) {
          data = data.data;
        }

        if (data?.noticia) {
          data = data.noticia;
        }

        if (data?.result) {
          data = data.result;
        }


        /*
         * Caso o Worker retorne:
         *
         * { results: [ ... ] }
         */

        if (
          Array.isArray(data?.results)
        ) {

          data = data.results[0];

        }


        if (!data) {
          throw new Error(
            "Worker não retornou a notícia."
          );
        }


        const news = normalize(data);


        if (!news.titulo) {
          throw new Error(
            "Notícia retornada sem título."
          );
        }


        /* =========================
           IMAGEM
        ========================= */

        const imageHTML =
          news.imagem_capa || news.imagem
          ? `
            <div class="article-cover">

              <img
                src="${esc(news.imagem_capa || news.imagem)}"
                alt="${esc(news.titulo)}"
              >

            </div>
          `
          : "";


        /* =========================
           FONTE
        ========================= */

        let sourceHTML = "";

        if (news.fonte) {

          sourceHTML += `
            <span class="source-label">
              Fonte: ${esc(news.fonte)}
            </span>
          `;

        }


        if (news.url_fonte) {

          sourceHTML += `
            <a
              class="source-link"
              href="${esc(news.url_fonte)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              Fonte original ↗
            </a>
          `;

        }


        /* =========================
           ARTIGO
        ========================= */

        root.innerHTML = `

          <article class="article">

            <div class="article-head">

              <span class="category-badge static">
                ${esc(news.categoria)}
              </span>

              <h1>
                ${esc(news.titulo)}
              </h1>

              ${
                news.resumo
                  ? `
                    <p class="article-lead">
                      ${esc(news.resumo)}
                    </p>
                  `
                  : ""
              }

              <div class="article-meta">

                <span>
                  Por
                  <b>${esc(news.autor)}</b>
                </span>

                <i></i>

                <span>
                  ${esc(
                    formatDate(
                      news.data_publicacao
                    )
                  )}
                </span>

              </div>

            </div>


            ${imageHTML}


            <div class="article-body">

              ${
                formatContent(
                  news.conteudo ||
                  news.resumo
                )
              }

            </div>


            <div class="article-share">

              <span>
                Compartilhar
              </span>

              <button
                type="button"
                id="copyLinkBtn"
              >
                Copiar link
              </button>

              ${sourceHTML}

            </div>

          </article>

        `;


        /* =========================
           COPIAR LINK
        ========================= */

        $("#copyLinkBtn")?.addEventListener(
          "click",
          async () => {

            try {

              await navigator.clipboard.writeText(
                window.location.href
              );

              $("#copyLinkBtn").textContent =
                "Link copiado!";

              setTimeout(() => {

                $("#copyLinkBtn").textContent =
                  "Copiar link";

              }, 2000);

            } catch (error) {

              console.warn(
                "Não foi possível copiar o link.",
                error
              );

            }

          }
        );


        /* =========================
           SEO
        ========================= */

        if (news.meta_description) {

          let meta =
            document.querySelector(
              'meta[name="description"]'
            );

          if (!meta) {

            meta =
              document.createElement("meta");

            meta.name = "description";

            document.head.appendChild(meta);

          }

          meta.content =
            news.meta_description;

        }


        /*
         * Atualiza título da aba.
         */

        document.title =
          news.titulo + " — NEWSFY";


        /*
         * Analytics da notícia.
         */

        if (
          typeof gtag === "function"
        ) {

          gtag(
            "event",
            "view_news",
            {
              news_id: String(news.id),
              news_title: news.titulo,
              news_category: news.categoria
            }
          );

        }


      } catch (error) {

        console.error(
          "NEWSFY: erro ao carregar notícia:",
          error
        );


        root.innerHTML = `

          <div class="empty-state">

            <div>!</div>

            <h2>
              Notícia não encontrada
            </h2>

            <p>
              Não foi possível carregar esta notícia.
              Verifique o endereço ou tente novamente.
            </p>

            <a
              class="btn btn-primary"
              href="noticias.html"
            >
              Ver notícias
            </a>

          </div>

        `;

      }

    }


    /* =========================
       MENU
    ========================= */

    function setupMenu() {

      const sidebar =
        $("#leftSidebar");

      const overlay =
        $("#mobileOverlay");

      const button =
        $("#menuToggle");


      function closeMenu() {

        sidebar?.classList.remove("open");

        overlay?.classList.remove("show");

      }


      button?.addEventListener(
        "click",
        () => {

          sidebar?.classList.toggle("open");

          overlay?.classList.toggle("show");

        }
      );


      overlay?.addEventListener(
        "click",
        closeMenu
      );


      document
        .querySelectorAll(".nav-category")
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              const category =
                button.dataset.category;

              window.location.href =
                "noticias.html?categoria=" +
                encodeURIComponent(category);

            }
          );

        });

    }


    /* =========================
       TEMA
    ========================= */

    function setupTheme() {

      const button =
        $("#themeBtn");


      if (
        localStorage.getItem(
          "newsfy-theme"
        ) === "soft"
      ) {

        document.body.classList.add(
          "soft-theme"
        );

      }


      button?.addEventListener(
        "click",
        () => {

          document.body.classList.toggle(
            "soft-theme"
          );


          localStorage.setItem(
            "newsfy-theme",

            document.body.classList.contains(
              "soft-theme"
            )
              ? "soft"
              : "dark"
          );

        }
      );

    }


    /* =========================
       BUSCA
    ========================= */

    function setupSearch() {

      const input =
        $("#globalSearch");


      input?.addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Enter"
          ) {

            const value =
              input.value.trim();


            window.location.href =
              "noticias.html" +
              (
                value
                  ? "?busca=" +
                    encodeURIComponent(value)
                  : ""
              );

          }

        }
      );

    }


    /* =========================
       INIT
    ========================= */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        $("#year").textContent =
          new Date().getFullYear();

        setupMenu();

        setupTheme();

        setupSearch();

        loadArticle();

      }
    );

  })();
  </script>
